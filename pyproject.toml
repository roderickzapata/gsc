[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc-export"
version = "1.0.0"
description = "Export Google Search Console Search Analytics data to CSV."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Roderick Zapata | RYLCO"},
]
dependencies = [
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
]

[project.scripts]
gsc-export = "download:main"
